name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: |
        cd frontend
        npm ci
        npm run build

    - name: Package frontend build
      run: tar -czf "frontend-dist-${GITHUB_REF_NAME}.tar.gz" -C frontend dist

    # softprops/action-gh-release is idempotent: if the release already
    # exists (e.g. published manually via the UI or gh, which is what made
    # the archived actions/create-release@v1 fail on v0.1.0), it attaches
    # the artifacts to it instead of erroring.
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        body: |
          See CHANGELOG.md for details.
        files: |
          frontend-dist-*.tar.gz
