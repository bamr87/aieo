version: '3.8'

services:
  # ---------- AIEO MCP Server + Audit Client ----------
  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aieo-mcp-server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./reports:/app/reports
      - ./sites.txt:/app/sites.txt:ro
    # Default: runs the MCP server on stdio (for MCP clients to connect)
    command: ["python", "-m", "app.mcp_server"]
    stdin_open: true

  mcp-audit:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aieo-mcp-audit
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./reports:/app/reports
      - ./sites.txt:/app/sites.txt:ro
      - ./mcp_client_audit.py:/app/mcp_client_audit.py:ro
    command: ["python", "/app/mcp_client_audit.py", "--sites", "/app/sites.txt", "--output", "/app/reports"]

  # ---------- Infrastructure Services ----------
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aieo-postgres
    environment:
      POSTGRES_USER: aieo
      POSTGRES_PASSWORD: aieo
      POSTGRES_DB: aieo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aieo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aieo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aieo-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:


