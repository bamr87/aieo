# fleet.manifest.yml — this repository's AI fleet, in the
# shared 'fleet/v1' vocabulary. See docs/FLEET-SPEC.md in
# bamr87/wtd. Generated by `wtd fleet adopt`; edit freely —
# hand-written values survive regeneration of other fields.
spec_version: fleet/v1
repo: bamr87/aieo
provenance: derived
summary: Two lanes — the `@claude` mention handler (claude.yml) and the manual it-journey content pilot (aieo-it-journey-pilot.yml), which scores/rewrites markdown through the AIEO engine with OpenAI and/or Anthropic keys.
lanes:
- id: claude
  kind: mention
  harness: claude-code-action
  implementation: .github/workflows/claude.yml
  description: Claude
  triggers:
  - kind: event
    events:
    - issue_comment
    - issues
    - pull_request_review
    - pull_request_review_comment
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  - CLAUDE_CODE_OAUTH_TOKEN
  guardrails:
    never_merges: true
    opens_pull_requests: false
- id: it-journey-pilot
  kind: content
  harness: engine
  implementation: .github/workflows/aieo-it-journey-pilot.yml
  description: AIEO pilot (it-journey quickstart) — audit-only / enhance / expand markdown in bamr87/it-journey via the reusable aieo-content-reusable.yml (python -m tools.aieo_runner)
  triggers:
  - kind: dispatch
  switch: null
  uses_tokens:
  - ANTHROPIC_API_KEY
  guardrails:
    never_merges: true
    opens_pull_requests: false
tokens:
- name: ANTHROPIC_API_KEY
  scope: fleet
  required: false
  purpose: Fallback Claude auth, used only when the OAuth token is absent.
  used_by:
  - claude
  - it-journey-pilot
- name: CLAUDE_CODE_OAUTH_TOKEN
  scope: fleet
  required: true
  purpose: 'Preferred Claude auth (house convention: OAuth first). Produced by 
`claude setup-token`.'
  used_by:
  - claude

