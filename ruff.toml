# Ruff configuration for this repo.
#
# The point of this file is that the rule set is DECLARED. Ruff's built-in
# defaults are not a stable contract: ruff 0.16 broadened them well beyond the
# historical E4/E7/E9/F (adding I, UP, BLE, B, RUF, ...), and because this repo
# carried no ruff config at all, `ruff check backend/` went from "All checks
# passed!" on 0.15.4 to "Found 754 errors." on 0.16.1 with no source change.
#
# Pinning the ruff *version* in CI would hide that, but the fleet dependency
# policy is ALWAYS-LATEST — no version pins, no lockfiles (see
# bamr87/bamr87 docs/DEPENDENCIES.md). So the rule set is pinned here, in
# config, where it is reviewable and can only change on purpose, and ruff
# itself is free to float.
#
# `select` below reproduces ruff's pre-0.16 default, which this tree is known
# to be clean against. Widening it is a deliberate cleanup, not an upgrade side
# effect: ruff 0.16's defaults report 754 findings here (565 auto-fixable),
# tracked separately.

[lint]
select = ["E4", "E7", "E9", "F"]
